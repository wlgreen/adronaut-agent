name: ci

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Docs updated check
        env:
          DOCS_CHECK_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          DOCS_CHECK_HEAD: ${{ github.sha }}
        run: |
          python scripts/check_docs_updated.py

      - name: Test
        run: |
          pytest -q
